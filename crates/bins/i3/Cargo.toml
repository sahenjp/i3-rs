[package]
name = "i3"
description = "Rust port of i3 window manager (1:1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
i3-core = { path = "../../i3-core" }
libi3 = { path = "../../libi3" }
x11rb = { workspace = true }
# C: main.c uses libev for the event loop; the port keeps calloop in the
# manifest for that phase of main.rs (not wired yet), so the unused-dep lint
# is allowed here instead of deleting the dependency again later.
calloop = { workspace = true }
libc = { workspace = true }
serde_json = { workspace = true }

[lints.cargo]
unused_dependencies = "allow"
