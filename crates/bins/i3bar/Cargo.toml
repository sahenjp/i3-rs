[package]
name = "i3bar"
description = "Rust port of i3bar (1:1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "i3bar"
path = "src/main.rs"

[dependencies]
libi3 = { path = "../../libi3" }
i3-core = { path = "../../i3-core" }
x11rb = { workspace = true }
libc = { workspace = true }
serde_json = { workspace = true }
# C: i3bar/child.c parses the JSON itself; serde (derive) is kept for the
# typed payload structs of a later phase, so the unused-dep lint is allowed
# here instead of deleting the dependency again later.
serde = { workspace = true }

[lints.cargo]
unused_dependencies = "allow"
